[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bartool"
version = "0.1.0"
description = "CLI tool for inspecting and managing Barrel archives"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "pybarrel",
]

[project.scripts]
bartool = "bartool.bartool:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
